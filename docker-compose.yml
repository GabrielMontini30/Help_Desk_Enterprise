version: '4.0'
services:
  db:
    image: mysql
    container_name: Help_Desk_Enterprise
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: help_desk_enterprise
      MYSQL_USER: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3309:3306"
    volumes:
      - gabriel_data:/var/lib/mysql

volumes:
  gabriel_data: